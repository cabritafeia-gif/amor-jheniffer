<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Amor por Jheniffer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff5f9e, #ff9a9e);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 0.3s;
        }

        .container {
            text-align: center;
            color: white;
            z-index: 2;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        button {
            padding: 15px 35px;
            font-size: 1.2em;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background: white;
            color: #ff3b7a;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        #amor {
            display: none;
            font-size: 3.5em;
            margin-top: 30px;
            animation: glow 1s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff;
            }
            to {
                text-shadow: 0 0 30px #ff004c;
            }
        }

        /* Corações */
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: red;
            transform: rotate(45deg);
            animation: float 6s linear infinite;
            opacity: 0.7;
        }

        .heart::before,
        .heart::after {
            content: '';
            width: 20px;
            height: 20px;
            background: red;
            border-radius: 50%;
            position: absolute;
        }

        .heart::before {
            top: -10px;
            left: 0;
        }

        .heart::after {
            left: -10px;
            top: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(45deg);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) rotate(45deg);
                opacity: 0;
            }
        }

        .piscar {
            animation: piscar 0.3s infinite;
        }

        @keyframes piscar {
            0% { background: #ff5f9e; }
            50% { background: #ff004c; }
            100% { background: #ff5f9e; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Um site feito com amor ❤️</h1>
        <button onclick="mostrarAmor()">Clique aqui</button>
        <div id="amor">Jheniffer, meu amor ❤️</div>
    </div>

    <script>
        function mostrarAmor() {
            document.getElementById("amor").style.display = "block";
            document.body.classList.add("piscar");

            setTimeout(() => {
                document.body.classList.remove("piscar");
            }, 3000);
        }

        // Criar corações automaticamente
        function criarCoracao() {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
            heart.style.background = Math.random() > 0.5 ? "#ff004c" : "#ff6fa5";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(criarCoracao, 300);
    </script>

</body>
</html>
